name: App packages

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/app-packages.yml'
      - '.github/workflows/native-runtime.yml'
      - 'tool/ci/collect_native.py'
      - 'tool/ci/test_collect_native.py'
      - 'tool/ci/app_build.py'
      - 'tool/ci/test_app_build.py'
      - 'tool/inspect_go_catalog_hap.py'
      - 'tool/go_curriculum/audit_native.py'
      - 'tool/build_ios_go_runtime.sh'
      - 'tool/build_macos_go_runtime.sh'
      - 'lib/**'
      - 'assets/**'
      - 'native/go_runtime/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'ohos/**'
      - 'windows/**'
      - 'pubspec.*'

permissions:
  contents: read

concurrency:
  group: app-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hash identical checkout bytes on Windows producers and Unix consumers.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GO_VERSION: '1.27.1'
  CORE_REVISION: 8e031313ffc8d531c5a6b4d131f721f35da04c86

jobs:
  native:
    name: Source-matched native dependencies
    uses: ./.github/workflows/native-runtime.yml
    permissions:
      contents: read

  package:
    name: App / ${{ matrix.platform }} / ${{ matrix.arch }}
    needs: native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: android, arch: universal, runner: ubuntu-24.04}
          - {platform: ios, arch: arm64, runner: macos-15-intel}
          - {platform: ohos, arch: arm64-v8a, runner: ubuntu-24.04}
          - {platform: linux, arch: x86_64, runner: ubuntu-24.04}
          - {platform: windows, arch: x86_64, runner: windows-2025}
          - {platform: macos, arch: arm64, runner: macos-26}
          - {platform: macos, arch: x86_64, runner: macos-15-intel}
    defaults:
      run:
        shell: bash
        working-directory: qfli_go
    env:
      QFLI_PLATFORM: ${{ matrix.platform }}
      QFLI_ARCH: ${{ matrix.arch }}
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      FLUTTER_OHOS_STORAGE_BASE_URL: https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      PYTHONUTF8: '1'
    steps:
      - name: Enable long Git paths on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git config --global core.longpaths true

      - name: Check out the application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: qfli_go
          persist-credentials: false

      # pubspec.yaml resolves the shared core from this sibling directory.
      - name: Check out the pinned shared core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: azurekiln2333/qflistudio-core
          ref: ${{ env.CORE_REVISION }}
          path: qflistudio-core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Download source-matched native runtime
        if: matrix.platform == 'android' || matrix.platform == 'ohos' || matrix.platform == 'windows' || matrix.platform == 'linux'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          path: qfli_go/build/native-artifacts/${{ matrix.platform }}

      - name: Start the evidence directory
        run: python tool/ci/app_build.py init

      - name: Test the package helper
        run: |
          set -o pipefail
          python -m unittest discover -s tool/ci -p test_app_build.py -v 2>&1 \
            | tee "build/app-artifacts/app-$QFLI_PLATFORM-$QFLI_ARCH/reports/ci-helper-tests.log"

      - name: Install the Linux desktop toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev

      - name: Set up Java
        if: matrix.platform == 'android' || matrix.platform == 'ohos'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the OHOS profile parser
        if: matrix.platform == 'ohos'
        run: python -m pip install --disable-pip-version-check json5==0.12.1

      # Only Apple app jobs rebuild the Go runtime from source.
      - name: Set up Go
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Validate source-matched native runtime
        if: matrix.platform == 'windows' || matrix.platform == 'linux'
        env:
          QFLI_NATIVE_ARTIFACT_DIR: build/native-artifacts/${{ matrix.platform }}
        run: python tool/ci/app_build.py validate-native

      - name: Consume source-matched mobile native runtime
        if: matrix.platform == 'android' || matrix.platform == 'ohos'
        env:
          QFLI_NATIVE_ARTIFACT_DIR: build/native-artifacts/${{ matrix.platform }}
        run: python tool/ci/app_build.py consume-native

      - name: Install the OHOS command-line SDK
        if: matrix.platform == 'ohos'
        run: python tool/ci/app_build.py setup-ohos

      - name: Set up the pinned Flutter-OH SDK
        run: python tool/ci/app_build.py setup-flutter

      - name: Prepare the pinned core for Flutter-OH
        run: |
          set -euo pipefail
          python -B ../qflistudio-core/tool/ci/prepare_flutter_core.py \
            --flavor ohos --sdk-root "$QFLI_FLUTTER_ROOT" \
            --sdk-revision 62357a93d653bf844f730bb1f4b7cc9e2139d14e 2>&1 \
            | tee "build/app-artifacts/app-$QFLI_PLATFORM-$QFLI_ARCH/reports/core-preparation.log"

      - name: Provision the Go runtime toolchain
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        run: python tool/ci/app_build.py setup-native

      - name: Build and inspect the application package
        run: python tool/ci/app_build.py build

      - name: Finalize the evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python tool/ci/app_build.py finalize --job-status "$JOB_STATUS"

      - name: Upload the application package and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: qfli_go/build/app-artifacts/app-${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
